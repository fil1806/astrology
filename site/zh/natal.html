<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">✦ 占星学</a>
    <nav>
      <a href="index.html">首页</a>
      <a href="natal.html">本命盘</a>
      <a href="planets.html">行星</a>
      <a href="zodiac.html">星座</a>
      <a href="houses.html">宫位</a>
      <a href="aspects.html">相位</a>
      <a href="practice.html">练习</a>
      <a href="audio.html">音频</a>
    </nav>
  </div>
</header>

<main>
  <h1>本命盘</h1>
  <p class="lead">输入出生日期、时间和地点，本命盘会直接在此生成。数据不会发送到任何地方：计算在你的浏览器中完成。</p>

  <form id="natal-form" class="natal-form" autocomplete="off">
    <label class="f-name">姓名 <span class="opt">（可选）</span>
      <input type="text" name="name" maxlength="60" placeholder="例如：小安">
    </label>
    <label class="f-date">出生日期
      <input type="date" name="date" required min="1800-01-01" max="2100-12-31">
    </label>
    <label class="f-time">出生时间
      <input type="time" name="time" value="12:00">
    </label>
    <label class="f-unknown"><input type="checkbox" name="unknown"> 时间不详</label>

    <label class="f-place">出生地点
      <input type="text" name="place" placeholder="输入城市名称" required>
      <ul id="place-results" class="place-results" hidden></ul>
    </label>
    <p class="place-chosen" id="place-chosen"></p>

    <details class="f-manual">
      <summary>手动输入坐标</summary>
      <div class="manual-grid">
        <label>纬度 <input type="number" name="lat" step="0.0001" min="-90" max="90" placeholder="55.7558"></label>
        <label>经度 <input type="number" name="lon" step="0.0001" min="-180" max="180" placeholder="37.6173"></label>
        <label>时区 <input type="text" name="tz" placeholder="Europe/Moscow"></label>
      </div>
      <p class="hint">时区采用 IANA 格式（Asia/Shanghai、Europe/London），据此计算出生当日的夏令时与历史上的时制调整。</p>
    </details>

    <button type="submit" class="btn">生成本命盘</button>
    <p class="form-error" id="form-error" role="alert"></p>
  </form>

  <section id="natal-result" hidden>
    <h2 id="result-title">本命盘</h2>
    <p class="result-meta" id="result-meta"></p>
    <div class="chart-wrap" id="chart"></div>
    <p class="share-row">
      <button type="button" class="btn" id="pdf-btn">下载 PDF</button>
      <button type="button" class="btn btn-ghost" id="share-btn">复制本命盘链接</button>
      <span id="share-note" class="hint"></span>
    </p>

    <h2>行星</h2>
    <div class="table-wrap"><table id="planets-table"></table></div>

    <div id="houses-block">
      <h2>宫位与四轴</h2>
      <div class="table-wrap"><table id="houses-table"></table></div>
    </div>

    <h2>相位</h2>
    <div class="table-wrap"><table id="aspects-table"></table></div>

    <h2>星盘概要</h2>
    <div id="reading" class="reading"></div>
    <blockquote>这只是起点，而非完整解读：请按照<a href="index.html">学习计划</a>的步骤，自己把行星、星座和宫位联系起来。详见<a href="planets.html">行星</a>、<a href="zodiac.html">星座</a>、<a href="houses.html">宫位</a>、<a href="aspects.html">相位</a>。</blockquote>
  </section>
</main>

<footer>
  占星学习网站 · 内容持续更新

</body>
</html>
